<!DOCTYPE html>
<html lang="en" data-key="alpha">
<head>
<meta charset="utf-8">
<title>CalGames 2026 Content Desk: overlay prototype</title>

<!-- Prototype only. Production self-hosts WOFF2s. See docs/03-brand.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Chivo:wght@700;900&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../packages/theme/tokens.css">

<style>
/* ==========================================================================
   Prototype-only layout. The tokens, primitives, and motion system all come
   from packages/theme/tokens.css. Nothing below redefines a brand value.
   ========================================================================== */

body { background: #101014; overflow: hidden; }
:root[data-key="luma"] body { background: #000; }

/* 1920x1080 stage, scaled to fit whatever window it's in. OBS renders it 1:1. */
#stageWrap { position: fixed; inset: 0; overflow: hidden; }
#stage {
  position: absolute; top: 50%; left: 50%;
  width: 1920px; height: 1080px;
  transform-origin: center center;
  background: var(--page-bg);
  overflow: hidden;
}
:root[data-key="alpha"] #stage {
  /* checkerboard so transparency is visible while designing; never in OBS */
  background-image:
    linear-gradient(45deg, #1a1a20 25%, transparent 25%, transparent 75%, #1a1a20 75%),
    linear-gradient(45deg, #1a1a20 25%, transparent 25%, transparent 75%, #1a1a20 75%);
  background-size: 48px 48px;
  background-position: 0 0, 24px 24px;
}
/* "Hide checker" must outgun the alpha rule above, which is why the key
   selector repeats here: #stage[data-clean] alone loses on specificity. */
:root[data-key="alpha"] #stage[data-clean="1"] { background-image: none; }

.screen { position: absolute; inset: 0; display: none; }
.screen[data-active] { display: block; }

/* The Gold Sweep, as a full-stage wipe between screens. Leading edge is
   skewed -12deg with a brighter band, tying the signature transition to the
   chamfer geometry. */
#sweep {
  position: absolute; top: -12%; bottom: -12%; left: 0; width: 130%;
  z-index: 60;
  background: linear-gradient(90deg,
    var(--cg-gold) 0 82%, var(--cg-gold-hi) 82% 88%, transparent 88%);
  transform: translateX(-101%) skewX(-12deg);
  will-change: transform;
  pointer-events: none;
}
#sweep[data-run] { animation: cg-sweep var(--dur-sweep) var(--ease-sweep) both; }

/* ---------------------------------------------------------------- overview */
#overview {
  background-color: var(--cg-purple-void);
  background-image: var(--tex-perf), var(--atmo);
  background-size: var(--tex-perf-size), cover;
}
:root[data-key="luma"] #overview { background-color: var(--cg-purple); background-image: var(--tex-perf); }

.ov-head {
  position: absolute; top: var(--safe-y); left: 0; right: 0;
  text-align: center;
}
.ov-head .ov-label {
  font-family: var(--font-cond); font-weight: 700;
  font-size: var(--t-title); letter-spacing: .22em; text-transform: uppercase;
  color: var(--cg-gold);
  /* Tracking adds a trailing space per glyph; centered tracked text sits half
     a track left of center without the indent. */
  text-indent: .22em;
}
.ov-head .ov-tick { width: 420px; margin: 12px auto 0; height: 4px; background: var(--tick); }
.ov-body {
  position: absolute; top: 190px; left: var(--safe-x); right: var(--safe-x); bottom: var(--safe-y);
  /* Center column is the reserved 320x120 logo lockup slot (see docs/03). */
  display: grid; grid-template-columns: 1fr var(--cg-logo-slot-w) 1fr; gap: var(--gap);
}
.ov-side { display: flex; flex-direction: column; }
.ov-robots { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); align-items: end; }
.ov-band {
  position: relative;
  margin-top: var(--gap); padding: 12px 0; text-align: center;
  font-family: var(--font-cond); font-weight: 700;
  font-size: var(--t-label); letter-spacing: .2em; text-transform: uppercase;
  text-indent: .2em;
  color: var(--cg-white);
  clip-path: var(--chamfer);
}
/* Gold edges are filled elements, never box-shadow, because luma strips shadows. */
.ov-band::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: var(--cg-gold);
}
.ov-side--red  .ov-band { background: var(--alliance-red); }
.ov-side--blue .ov-band { background: var(--alliance-blue); }

.robot { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }

/* Robot cutout sits on a common floor line with a drawn plinth shadow.
   No photo -> tier-3 fallback: gold number on a purple plinth (docs/07). */
.robot-art {
  position: relative; flex: 1;
  display: grid; place-items: end center;
  min-height: 0;
}
.robot-art img { max-height: 100%; max-width: 100%; object-fit: contain; object-position: bottom; }
/* Tier-3 fallback plinth: chamfered plate, perf texture, gold base rule.
   Must read as a designed state, not a broken image. */
.robot-art--fallback {
  position: relative;
  display: grid; place-items: center;
  background-color: var(--cg-purple-lo);
  background-image: var(--tex-perf),
                    linear-gradient(180deg, var(--cg-purple-hi), var(--cg-purple-lo));
  background-size: var(--tex-perf-size), cover;
  clip-path: var(--chamfer);
  width: 100%; height: 100%;
}
.robot-art--fallback::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 6px;
  background: var(--cg-gold);
}
.robot-art--fallback span {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: var(--t-hero); line-height: 1;
  color: var(--cg-gold);
}
/* Sized by digit count so long numbers keep real margins from the plinth
   edges: a 4-digit number at .82 grazed the sides. */
.robot-art--fallback span[data-len="4"] { font-size: calc(var(--t-hero) * .68); }
.robot-art--fallback span[data-len="5"] { font-size: calc(var(--t-hero) * .55); }
.robot-shadow {
  height: 14px; margin-top: 6px;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 72%);
}
:root[data-key="luma"] .robot-shadow { display: none; }

.robot-num {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: var(--t-score); line-height: 1;
  color: var(--cg-white); text-align: center; margin-top: 12px;
  letter-spacing: -.02em;
}
.robot-name {
  font-family: var(--font-cond); font-weight: 600; font-size: var(--t-body);
  color: var(--cg-white-dim); text-align: center; line-height: 1.05;
  letter-spacing: .04em; text-transform: uppercase;
  height: calc(var(--t-body) * 2.15); overflow: hidden;   /* fixed height: 2 lines */
}

.ov-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
.ov-logo {
  width: var(--cg-logo-slot-w); height: var(--cg-logo-slot-h);
  display: grid; place-items: center;
  clip-path: var(--chamfer);
  background: var(--cg-gold);
  /* Reserved logo lockup slot: the contest-winning mark drops in here as SVG.
     Placeholder wordmark is sized to fit the slot, not the other way round. */
  font-family: var(--font-display); font-weight: 800; font-size: 38px;
  font-variation-settings: "wdth" 100;
  color: var(--cg-black); text-align: center; line-height: .98;
  letter-spacing: -.01em; padding: 0 10px; overflow: hidden; box-sizing: border-box;
}
.ov-vs {
  font-family: var(--font-num); font-weight: 900; font-size: var(--t-title);
  color: var(--cg-gold); letter-spacing: .08em;
}

/* ------------------------------------------------------------- match / bar */
:root { --bar-h: 156px; }   /* hub tab + lower third key off this */

.bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: var(--bar-h);
  display: grid; grid-template-columns: 1fr 420px 1fr;
  background-color: var(--cg-purple-deep);
  background-image: var(--tex-perf),
                    linear-gradient(180deg, var(--cg-purple-lo), var(--cg-purple-deep));
  background-size: var(--tex-perf-size), cover;
  border-top: var(--rule);
}
:root[data-key="luma"] .bar { background-color: var(--cg-purple); background-image: var(--tex-perf); }

.bar-side { display: flex; align-items: center; gap: 28px; padding: 0 36px; }
.bar-side--red  { background: var(--alliance-red);  border-right: var(--rule); }
.bar-side--blue { background: var(--alliance-blue); border-left:  var(--rule); flex-direction: row-reverse; }

.bar-teams {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 700; font-size: var(--t-label);
  line-height: 1.16; color: var(--cg-white); letter-spacing: .02em;
}
.bar-side--blue .bar-teams { text-align: right; }

/* Fuel/tower readout centered over its RP strip; total centered between the
   strip and the clock, symmetric on both sides. */
.bar-stats { flex: 1; display: flex; align-items: center; justify-content: space-evenly; gap: 12px; }
.bar-side--blue .bar-stats { flex-direction: row-reverse; }
.bar-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; }
.bar-total {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: var(--t-score); line-height: 1;
  color: var(--cg-white); letter-spacing: -.03em;
}
.bar-sub {
  font-family: var(--font-cond); font-weight: 600; font-size: var(--t-label);
  color: var(--cg-white); opacity: .94; line-height: 1;
  letter-spacing: .06em; text-transform: uppercase;
}
/* Sub-line counters size to their value: a 3ch reservation reads as a hole. */
.bar-sub { text-align: center; }
.bar-sub .roll { min-width: 0; text-align: left; }
.bar-rp { display: flex; gap: 8px; }
/* Recess unearned badges against the alliance fills; no box-shadow ring,
   since the luma key strips shadows. */
.bar-rp .rp { background: rgba(0, 0, 0, .30); box-shadow: none; color: rgba(255, 255, 255, .72); }
.bar-rp .rp[data-earned="true"] { background: var(--cg-green-hi); color: var(--cg-white); }

.bar-center {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 0 12px;
}
.clock {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: var(--t-clock); line-height: 1;
  color: var(--cg-gold); letter-spacing: -.03em;
}
.phase { font-size: var(--t-label); }   /* 28px floor applies on air */

/* The 2026-specific graphic: which hub is live right now. A tab growing out
   of the bar's center column: flush, part of the scorebug, never floating. */
.hub {
  position: absolute; left: 50%; transform: translateX(-50%);
  /* +3px: the bar's gold border-top paints above its height, so the band must
     run unbroken beneath the tab. */
  bottom: calc(var(--bar-h) + 3px);
  /* Gold shell, purple face inset top+sides: the bar's gold band flows up
     and over the tab in one continuous line. */
  z-index: 5;
  display: flex; align-items: center; gap: 14px;
  padding: 16px 36px 10px;
  background: var(--cg-gold);
  --ch: 14px;
  clip-path: polygon(var(--ch) 0, calc(100% - var(--ch)) 0, 100% var(--ch),
                     100% 100%, 0 100%, 0 var(--ch));
  font-family: var(--font-cond); font-weight: 700; font-size: var(--t-label);
  letter-spacing: .14em; text-transform: uppercase; color: var(--cg-white);
  white-space: nowrap;
}
.hub::before {
  content: ""; position: absolute; inset: 3px 3px 0;
  background-color: var(--cg-purple);
  background-image: var(--tex-perf); background-size: var(--tex-perf-size);
  --ch: 12px;
  clip-path: polygon(var(--ch) 0, calc(100% - var(--ch)) 0, 100% var(--ch),
                     100% 100%, 0 100%, 0 var(--ch));
}
.hub > * { position: relative; }
.hub-dot { width: 22px; height: 22px; clip-path: var(--chamfer); --ch: 7px; background: var(--cg-white-dim); }
.hub-dot[data-on="red"]  { background: var(--alliance-red); }
.hub-dot[data-on="blue"] { background: var(--alliance-blue); }
.hub-dot[data-on="both"] { background: var(--cg-gold); }

/* ------------------------------------------------------------ lower third */
#third {
  position: absolute; left: var(--safe-x); bottom: calc(var(--bar-h) + 28px); z-index: 40;
  display: none; box-sizing: border-box; min-width: 560px; max-width: 690px;
  background-color: var(--cg-purple);
  background-image: var(--tex-perf); background-size: var(--tex-perf-size);
  clip-path: var(--chamfer);
  padding: 20px 40px 20px 54px;
}
#third::before {
  content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 10px;
  background: var(--cg-gold);
}
#third[data-show] { display: block; }
#third .t1 {
  font-family: var(--font-display); font-weight: 800; font-size: var(--t-title);
  font-variation-settings: "wdth" var(--wdth-display); line-height: 1.06;
  overflow-wrap: break-word;
}
#third .t2 { font-family: var(--font-cond); font-weight: 600; font-size: var(--t-body); color: var(--cg-gold); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }

/* ------------------------------------------------------------ telestrator */
#tele { position: absolute; inset: 0; z-index: 50; touch-action: none; cursor: crosshair; display: none; }
#tele[data-on] { display: block; }
#teleChip {
  position: absolute; left: var(--safe-x); bottom: var(--safe-y); z-index: 51;
  display: none;
}
#teleChip[data-on] { display: inline-flex; }

/* ------------------------------------------------------------------- ui */
#ui {
  position: fixed; top: 12px; left: 12px; z-index: 100;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 12px; max-width: calc(100vw - 24px);
  background: rgba(12,6,16,.92); border: 1px solid #3a2a44; border-radius: 8px;
  font-family: var(--font-cond); font-size: 13px; color: #d8ccdf;
}
#ui .grp { display: flex; gap: 6px; align-items: center; }
#ui .lbl { color: #8d7d97; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
#ui .btn { padding: 6px 12px; font-size: 12px; }
#ui[hidden] { display: none; }
</style>
</head>
<body>

<div id="stageWrap">
  <div id="stage">

    <!-- ============================ PRE-MATCH ALLIANCE OVERVIEW ========== -->
    <section class="screen" id="overview">
      <div class="ov-head">
        <div class="ov-label" id="ovLabel">Qualification 42</div>
        <div class="ov-tick"></div>
      </div>
      <div class="ov-body">
        <div class="ov-side ov-side--red">
          <div class="ov-robots stagger" id="redRobots"></div>
          <div class="ov-band">Red Alliance</div>
        </div>
        <div class="ov-center">
          <div class="ov-logo">CALGAMES<br>2026</div>
          <div class="ov-vs">VS</div>
        </div>
        <div class="ov-side ov-side--blue">
          <div class="ov-robots stagger" id="blueRobots"></div>
          <div class="ov-band">Blue Alliance</div>
        </div>
      </div>
    </section>

    <!-- ============================ LIVE MATCH ========================== -->
    <section class="screen" id="match">
      <div class="hub">
        <span class="hub-dot" id="hubDot" data-on="both"></span>
        <span id="hubText">Both hubs live</span>
      </div>

      <div class="bar">
        <div class="bar-side bar-side--red">
          <div class="bar-teams" id="redTeams"></div>
          <div class="bar-stats">
            <div class="bar-mid">
              <div class="bar-sub"><span class="num roll" id="redFuel">0</span> fuel · <span class="num roll" id="redTower">0</span> tower</div>
              <div class="bar-rp" id="redPips"></div>
            </div>
            <div class="bar-total num roll" id="redTotal" data-motion="essential">0</div>
          </div>
        </div>

        <div class="bar-center">
          <div class="clock num" id="clock" data-motion="essential">0:20</div>
          <div class="chip chip--accent phase" id="phase">Auto</div>
        </div>

        <div class="bar-side bar-side--blue">
          <div class="bar-teams" id="blueTeams"></div>
          <div class="bar-stats">
            <div class="bar-mid">
              <div class="bar-sub"><span class="num roll" id="blueFuel">0</span> fuel · <span class="num roll" id="blueTower">0</span> tower</div>
              <div class="bar-rp" id="bluePips"></div>
            </div>
            <div class="bar-total num roll" id="blueTotal" data-motion="essential">0</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================ SHARED OVERLAYS ====================== -->
    <div id="third"><div class="t1" id="thirdT1">Priya Raman</div><div class="t2" id="thirdT2">Analyst · CalGames Content Desk</div></div>

    <canvas id="tele"></canvas>
    <span class="chip chip--accent" id="teleChip">Analysis</span>

    <div id="sweep"></div>
  </div>
</div>

<div id="ui">
  <span class="lbl">Screen</span>
  <div class="grp">
    <button class="btn" data-screen="overview">Overview</button>
    <button class="btn" data-screen="match">Match</button>
  </div>
  <span class="lbl">Key</span>
  <div class="grp">
    <button class="btn" data-key="alpha">Alpha</button>
    <button class="btn" data-key="luma">Luma</button>
  </div>
  <div class="grp">
    <button class="btn" id="btnTele">Telestrator</button>
    <button class="btn" id="btnThird">Lower third</button>
    <button class="btn" id="btnDemo">Pause demo</button>
    <button class="btn" id="btnClean">Hide checker</button>
  </div>
  <span class="lbl">P pen · A arrow · E ellipse · S spotlight · Z undo · C clear · H hide · U toggle this bar</span>

<script>
/* ==========================================================================
   Prototype driver. Stands in for the `core` event bus described in
   docs/02-architecture.md: same event shapes, fake data.
   ========================================================================== */
const $ = s => document.querySelector(s);
const root = document.documentElement;
const params = new URLSearchParams(location.search);

/* ---- fit the 1920x1080 stage into the window ---------------------------- */
const stage = $('#stage');
function fit() {
  /* Rounded up a hair so fractional scaling never leaves a sub-pixel seam of
     page background at the stage edges. Mirrors fitStage in desk-client.js. */
  const s = Math.ceil(Math.min(innerWidth / 1920, innerHeight / 1080) * 2000) / 2000;
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---- match data (real CalGames 2025 teams, for realism) ----------------- */
const MATCH = {
  label: 'Qualification 42',
  red:  [{n:846,name:'The Funky Monkeys'},{n:1868,name:'Space Cookies'},{n:253,name:'Boba Bots'}],
  blue: [{n:100,name:'The Wildhats'},{n:115,name:'MVRT'},{n:670,name:'Homestead Robotics'}]
};
/* 2026 REBUILT bonus RP: icon says which, numeral says the threshold.
   Mirrors surfaces/_shared/rp.js, duplicated here because the prototype
   stays double-clickable from disk, where module imports don't resolve. */
const RP = [
  { key:'energized',    label:'Energized',    need:100, path:'M13 2 5 13.5h4.8L8 22 19 9.5h-5.4L16 2z' },
  { key:'supercharged', label:'Supercharged', need:360, path:'M9 1 2.5 9.5H6L4.8 15 13 5.5H9.2L11 1zM19 9l-6.5 8.5H16L14.8 23 23 13.5h-3.8L21 9z' },
  { key:'traversal',    label:'Traversal',    need:50,  path:'M3.5 21h4.4v-5H3.5zM9.8 21h4.4V10.5H9.8zM16.1 21h4.4V4h-4.4z' },
];

/* ---- build the alliance overview --------------------------------------- */
function robotCard(t, i) {
  /* Tier-3 fallback per docs/07-team-media.md: no uploaded cutout yet, so a
     gold number on a purple plinth. Must look deliberate, not broken. */
  return `<div class="robot reveal reveal--up" style="--i:${i}">
    <div class="robot-art"><div class="robot-art--fallback"><span class="num" data-len="${String(t.n).length}">${t.n}</span></div></div>
    <div class="robot-shadow"></div>
    <div class="robot-num num">${t.n}</div>
    <div class="robot-name">${t.name}</div>
  </div>`;
}
function buildOverview() {
  $('#ovLabel').textContent = MATCH.label;
  $('#redRobots').innerHTML  = MATCH.red.map(robotCard).join('');
  $('#blueRobots').innerHTML = MATCH.blue.map(robotCard).join('');
}
$('#redTeams').innerHTML  = MATCH.red.map(t => t.n).join('<br>');
$('#blueTeams').innerHTML = MATCH.blue.map(t => t.n).join('<br>');

for (const side of ['red','blue']) {
  $(`#${side}Pips`).innerHTML = RP.map(r =>
    `<span class="rp" data-rp="${r.key}" title="${r.label} · ${r.need}">` +
    `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${r.path}"/></svg>` +
    `<span class="rp-need num">${r.need}</span></span>`).join('');
}

/* ---- Gold Sweep screen transition -------------------------------------- */
let current = 'overview';
function show(name) {
  if (name === current) return;
  const sweep = $('#sweep');
  sweep.removeAttribute('data-run'); void sweep.offsetWidth; sweep.setAttribute('data-run','');
  /* swap behind the bar at the 50% point of the sweep */
  const half = parseFloat(getComputedStyle(root).getPropertyValue('--dur-sweep')) / 2 || 240;
  setTimeout(() => {
    document.querySelectorAll('.screen').forEach(s => s.removeAttribute('data-active'));
    $('#' + name).setAttribute('data-active','');
    if (name === 'overview') buildOverview();
    current = name;
    /* Keep the toggle bar honest when the demo drives the switch. */
    press('[data-screen]', $(`#ui [data-screen="${name}"]`));
  }, half);
}

/* ---- Number Roll ------------------------------------------------------- */
function roll(el, to) {
  const from = +el.dataset.v || 0;
  if (from === to) return;
  el.dataset.v = to;
  const dur = parseFloat(getComputedStyle(root).getPropertyValue('--dur-count')) || 600;
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);                 // ease-out cubic
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

/* ---- fake match driver ------------------------------------------------- */
const S = { clock: -22, red:{fuel:0,tower:0}, blue:{fuel:0,tower:0}, autoWinner:'red' };
let running = params.get('demo') !== '0';

function phaseOf(c) {
  if (c < -20) return ['Pre-match', 'both'];
  if (c < 0)   return ['Auto', 'both'];
  if (c < 10)  return ['Transition', 'both'];
  if (c < 110) {
    // Odd shifts belong to the AUTO LOSER, even shifts to the winner,
    // verified against Cheesy Arena's Hub.isShiftActive. Winning auto buys the
    // LATER shifts. The real system takes this from the field rather than
    // inferring it, because Cheesy decides auto on fuel count alone and
    // settles a tie with a coin flip. See docs/10-field-bridge.md.
    const shift = Math.floor((c - 10) / 25) + 1;
    const loser = S.autoWinner === 'red' ? 'blue' : 'red';
    return [`Shift ${shift}`, shift % 2 ? loser : S.autoWinner];
  }
  if (c < 140) return ['End game', 'both'];
  return ['Final', 'both'];
}
function clockText(c) {
  const rem = c < 0 ? -c : 140 - c;
  const s = Math.max(0, Math.ceil(rem));
  return c < 0 ? `0:${String(s).padStart(2,'0')}`
               : `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function total(a) { return S[a].fuel + S[a].tower; }

function render() {
  const [phase, hub] = phaseOf(S.clock);
  $('#clock').textContent = clockText(S.clock);
  $('#phase').textContent = phase;

  const dot = $('#hubDot'); dot.dataset.on = hub;
  $('#hubText').textContent = hub === 'both' ? 'Both hubs live' : `${hub} hub live`;

  for (const a of ['red','blue']) {
    roll($(`#${a}Fuel`),  S[a].fuel);
    roll($(`#${a}Tower`), S[a].tower);
    roll($(`#${a}Total`), total(a));
    const badges = $(`#${a}Pips`).children;
    badges[0].dataset.earned = S[a].fuel  >= RP[0].need;
    badges[1].dataset.earned = S[a].fuel  >= RP[1].need;
    badges[2].dataset.earned = S[a].tower >= RP[2].need;
  }

  /* Lockdown at endgame: decorative motion off, score/clock/pips stay live. */
  if (S.clock >= 110 && S.clock < 140) root.setAttribute('data-lockdown','');
  else root.removeAttribute('data-lockdown');
}

setInterval(() => {
  if (!running) return;
  S.clock += 0.25;
  if (S.clock > 152) { S.clock = -22; S.red={fuel:0,tower:0}; S.blue={fuel:0,tower:0}; show('overview'); return; }
  /* Flip to the score bar BEFORE the countdown reaches zero-of-auto: the
     armed moment, mirroring `match.armed` in the real system. */
  if (S.clock > -21 && current !== 'match') show('match');

  const [, hub] = phaseOf(S.clock);
  if (S.clock > -20 && S.clock < 140) {
    for (const a of ['red','blue']) {
      if (hub === 'both' || hub === a) if (Math.random() < .55) S[a].fuel += 1 + (Math.random()*4|0);
    }
  }
  if (S.clock > 118 && Math.random() < .04) {
    const a = Math.random() < .5 ? 'red' : 'blue';
    if (S[a].tower < 90) S[a].tower += [10,20,30][Math.random()*3|0];
  }
  render();
}, 250);

/* ==========================================================================
   Telestrator. Strokes are normalized 0-1 and would go over the wire as
   `telestrator.stroke` events (docs/04); here they stay local.
   ========================================================================== */
const cv = $('#tele'), ctx = cv.getContext('2d');
cv.width = 1920; cv.height = 1080;
let tool = 'pen', strokes = [], live = null;
const INK = () => getComputedStyle(root).getPropertyValue('--ink-default').trim() || '#F0AF00';
const FADE = () => parseFloat(getComputedStyle(root).getPropertyValue('--ink-fade')) || 6000;

function pos(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  live = { tool, ink: INK(), pts: [pos(e)], born: performance.now() };
  strokes.push(live);
});
cv.addEventListener('pointermove', e => { if (live) live.pts.push(pos(e)); });
addEventListener('pointerup', () => { if (live) { live.born = performance.now(); live = null; } });

function draw() {
  ctx.clearRect(0, 0, 1920, 1080);
  const now = performance.now(), fade = FADE();

  /* Spotlight dims everything outside the lassoed region. It reads far better
     at 720p than an ellipse does. */
  const spots = strokes.filter(s => s.tool === 'spotlight' && (s === live || now - s.born < fade));
  if (spots.length) {
    ctx.save();
    ctx.fillStyle = 'rgba(10,3,14,.62)';
    ctx.fillRect(0, 0, 1920, 1080);
    ctx.globalCompositeOperation = 'destination-out';
    for (const s of spots) {
      ctx.beginPath();
      s.pts.forEach(([x,y], i) => i ? ctx.lineTo(x*1920, y*1080) : ctx.moveTo(x*1920, y*1080));
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  for (const s of strokes) {
    if (s.tool === 'spotlight') continue;
    const age = s === live ? 0 : now - s.born;
    if (age > fade) continue;
    ctx.globalAlpha = age > fade - 800 ? (fade - age) / 800 : 1;

    /* every stroke gets a black halo so gold survives on grey carpet */
    for (const pass of [{c:'#000', w:11}, {c:s.ink, w:7}]) {
      ctx.strokeStyle = pass.c; ctx.fillStyle = pass.c;
      ctx.lineWidth = pass.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      const p = s.pts, a = p[0], b = p[p.length - 1];
      if (s.tool === 'pen') {
        p.forEach(([x,y], i) => i ? ctx.lineTo(x*1920, y*1080) : ctx.moveTo(x*1920, y*1080));
        ctx.stroke();
      } else if (s.tool === 'arrow') {
        const [x1,y1] = [a[0]*1920, a[1]*1080], [x2,y2] = [b[0]*1920, b[1]*1080];
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        const ang = Math.atan2(y2-y1, x2-x1), h = 34;
        ctx.beginPath(); ctx.moveTo(x2,y2);
        ctx.lineTo(x2 - h*Math.cos(ang-.42), y2 - h*Math.sin(ang-.42));
        ctx.lineTo(x2 - h*Math.cos(ang+.42), y2 - h*Math.sin(ang+.42));
        ctx.closePath(); ctx.fill();
      } else if (s.tool === 'ellipse') {
        const cx=(a[0]+b[0])/2*1920, cy=(a[1]+b[1])/2*1080;
        ctx.ellipse(cx, cy, Math.abs(b[0]-a[0])/2*1920, Math.abs(b[1]-a[1])/2*1080, 0, 0, 7);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  const anyLive = strokes.some(s => s === live || now - s.born < fade);
  $('#teleChip').toggleAttribute('data-on', cv.hasAttribute('data-on') && anyLive);
  strokes = strokes.filter(s => s === live || now - s.born < fade);
  requestAnimationFrame(draw);
}
draw();

/* ---- controls ---------------------------------------------------------- */
function press(sel, on) {
  document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', b === on));
}
/* Scoped to #ui: <html> itself carries data-key, and an unscoped selector
   would hand the whole page a click handler. */
document.querySelectorAll('#ui [data-screen]').forEach(b =>
  b.onclick = () => { show(b.dataset.screen); press('[data-screen]', b); });
document.querySelectorAll('#ui [data-key]').forEach(b =>
  b.onclick = () => { root.dataset.key = b.dataset.key; press('#ui [data-key]', b); });

$('#btnTele').onclick  = e => { cv.toggleAttribute('data-on'); e.target.setAttribute('aria-pressed', cv.hasAttribute('data-on')); };
$('#btnThird').onclick = e => {
  const t = $('#third'), on = !t.hasAttribute('data-show');
  e.target.setAttribute('aria-pressed', on);
  if (on) { t.setAttribute('data-show',''); t.className = 'third'; }
  else {
    /* let the Slide Third exit finish before hiding: a lower third that
       vanishes instead of leaving is invisible in the room */
    t.className = 'third--exit';
    const d = parseFloat(getComputedStyle(root).getPropertyValue('--dur-out')) || 260;
    setTimeout(() => t.removeAttribute('data-show'), d);
  }
};
$('#btnDemo').onclick  = e => { running = !running; e.target.textContent = running ? 'Pause demo' : 'Resume demo'; };
$('#btnClean').onclick = e => { const on = stage.dataset.clean !== '1'; stage.dataset.clean = on ? '1' : '0'; e.target.setAttribute('aria-pressed', on); };

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'p') tool = 'pen';
  if (k === 'a') tool = 'arrow';
  if (k === 'e') tool = 'ellipse';
  if (k === 's') tool = 'spotlight';
  if (k === 'z') strokes.pop();
  if (k === 'c') strokes = [];
  if (k === 'h') cv.toggleAttribute('data-on');
  if (k === 'u') $('#ui').toggleAttribute('hidden');
});

/* ---- boot -------------------------------------------------------------- */
root.dataset.key = params.get('key') || 'alpha';
if (params.get('ui') === '0') $('#ui').setAttribute('hidden','');
buildOverview();
$('#overview').setAttribute('data-active','');
/* Reflect the boot state in the toggle bar, so nothing looks unset. */
press('[data-screen]', $('#ui [data-screen="overview"]'));
press('#ui [data-key]', $(`#ui [data-key="${root.dataset.key}"]`));
render();
</script>
</body>
</html>
