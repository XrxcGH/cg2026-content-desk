<!doctype html>
<html lang="en" data-key="alpha" data-scale="stream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Telestrator pad — CalGames 2026</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<style>
/* Tablet surface. Dark, because the analyst is sitting in a dim broadcast
   position and a white UI at arm's length is blinding. Big targets — this is
   driven with a stylus and a thumb, standing up, under time pressure. */
html, body { height: 100%; overscroll-behavior: none; }
body {
  background: var(--cg-purple-void);
  background-image: var(--tex-perf), var(--atmo);
  background-size: var(--tex-perf-size), cover;
  display: flex; flex-direction: column;
  touch-action: none; -webkit-user-select: none; user-select: none;
}

/* 16:9 pad, letterboxed — same aspect as programme so a circle drawn here
   lands as a circle on air. */
#pad {
  flex: 1; min-height: 0; position: relative;
  display: grid; place-items: center; padding: 10px;
}
/* Sized in JS — see layout(). An aspect-ratio box with no definite width or
   height collapses to zero here, because the only child is absolutely
   positioned so there's nothing to derive an intrinsic size from. Computing
   the largest 16:9 rect that fits is deterministic and avoids the CSS edge
   cases entirely, which is what you want in a broadcast tool. */
#frameBox {
  position: relative;
  background: #000;
  box-shadow: inset 0 0 0 3px var(--cg-gold-lo);
  overflow: hidden;
}
#frameImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#ink { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

#noFrame {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  color: var(--cg-white-dim); font-family: var(--font-cond); font-size: 17px;
  letter-spacing: .1em; text-transform: uppercase; padding: 24px; line-height: 1.8;
}
#noFrame[hidden] { display: none; }

/* toolbar */
#bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--cg-purple-deep); border-top: var(--rule); }
.grp { display: flex; gap: 6px; }
.sep { width: 1px; align-self: stretch; background: var(--cg-purple-hi); margin: 0 4px; }

.tool {
  min-width: 74px; padding: 13px 12px; border: 0; cursor: pointer;
  background: var(--cg-purple); color: var(--cg-white);
  clip-path: var(--chamfer); --ch: 9px;
  font-family: var(--font-cond); font-weight: 700; font-size: 13px;
  letter-spacing: .1em; text-transform: uppercase;
  transition: background var(--dur-tap) linear, transform var(--dur-tap) var(--ease-pop);
}
.tool:active { transform: scale(.94); }
.tool[aria-pressed="true"] { background: var(--cg-gold); color: var(--cg-black); }
.tool small { display: block; font-size: 10px; opacity: .55; letter-spacing: .06em; }

.ink { width: 44px; height: 44px; border: 0; cursor: pointer; padding: 0;
  clip-path: var(--chamfer); --ch: 7px; box-shadow: inset 0 0 0 3px transparent; }
.ink[aria-pressed="true"] { box-shadow: inset 0 0 0 4px var(--cg-white); }

#status { margin-left: auto; display: flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 11px; color: var(--cg-white-dim); }
.dot { width: 10px; height: 10px; clip-path: var(--chamfer); --ch: 3px; background: var(--st-bad); }
.dot[data-up="true"] { background: var(--st-ok); }

#tags { display: flex; gap: 6px; }
.tag { padding: 11px 12px; border: 0; cursor: pointer;
  background: var(--cg-purple-hi); color: var(--cg-white);
  clip-path: var(--chamfer); --ch: 7px;
  font-family: var(--font-num); font-weight: 900; font-size: 15px; }
.tag[data-alliance="red"] { box-shadow: inset 0 -4px 0 var(--alliance-red); }
.tag[data-alliance="blue"] { box-shadow: inset 0 -4px 0 var(--alliance-blue); }
.tag[aria-pressed="true"] { background: var(--cg-gold); color: var(--cg-black); }
</style>
</head>
<body>

<div id="pad">
  <div id="frameBox">
    <img id="frameImg" alt="" hidden>
    <div id="noFrame">No frozen frame<br><span style="opacity:.6;font-size:14px">
      Draw anyway, or send a frame from the desk</span></div>
    <canvas id="ink"></canvas>
  </div>
</div>

<div id="bar">
  <div class="grp" id="tools">
    <button class="tool" data-tool="pen" aria-pressed="true">Pen<small>P</small></button>
    <button class="tool" data-tool="arrow">Arrow<small>A</small></button>
    <button class="tool" data-tool="ellipse">Circle<small>E</small></button>
    <button class="tool" data-tool="spotlight">Spot<small>S</small></button>
    <button class="tool" data-tool="path">Path<small>R</small></button>
  </div>

  <div class="sep"></div>
  <div class="grp" id="inks"></div>

  <div class="sep"></div>
  <div id="tags"></div>

  <div class="sep"></div>
  <div class="grp">
    <button class="tool" id="undo">Undo<small>Z</small></button>
    <button class="tool" id="clear">Clear<small>C</small></button>
    <button class="tool" id="hide">Hide<small>H</small></button>
  </div>

  <div id="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></div>
</div>

<script type="module">
import { connect, applyDisplayMode, startTicker } from '/shared/desk-client.js';
import { StrokeBook, render } from '/shared/telestrator.js';

applyDisplayMode();
const $ = id => document.getElementById(id);
const desk = connect('draw');

const canvas = $('ink');
const ctx = canvas.getContext('2d');
const book = new StrokeBook();
// Debug handle so the pad can be driven and inspected from a console during
// rehearsal, and by the test harness.
window.__tele = { book, desk };

let tool = 'pen';
let ink = 'gold';
let tagTeam = null;

// ---- layout: largest 16:9 box that fits, then back the canvas at device res
// 16:9 matters — a circle drawn on a differently-shaped pad lands as an
// ellipse on air.
const pad = $('pad');
const frameBox = $('frameBox');

function layout() {
  const style = getComputedStyle(pad);
  const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
  const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);
  const availW = Math.max(0, pad.clientWidth - padX);
  const availH = Math.max(0, pad.clientHeight - padY);
  const w = Math.min(availW, availH * (16 / 9));
  const h = w * (9 / 16);
  frameBox.style.width = `${Math.round(w)}px`;
  frameBox.style.height = `${Math.round(h)}px`;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
}
new ResizeObserver(layout).observe(pad);
addEventListener('resize', layout);
layout();

// ---- ink swatches ---------------------------------------------------------
const INK_SWATCHES = [
  ['gold', '--cg-gold'], ['good', '--cg-green-hi'], ['note', '--cg-white'],
  ['red', '--alliance-red'], ['blue', '--alliance-blue'],
];
$('inks').innerHTML = INK_SWATCHES.map(([id, v]) =>
  `<button class="ink" data-ink="${id}" style="background:var(${v})" aria-pressed="${id === 'gold'}" title="${id}"></button>`).join('');

// ---- stroke transport -----------------------------------------------------
// Points are batched and flushed once per frame. A Pencil reports at 120Hz;
// relaying every sample would be 4x the messages for no visible gain.
let pending = null;
let seq = 0;

const relay = m => desk.relay('tele', m);

function flush() {
  if (pending && pending.pts.length) {
    relay({ k: 'pts', id: pending.id, pts: pending.pts });
    pending.pts = [];
  }
}

function pointFrom(e) {
  const r = canvas.getBoundingClientRect();
  return [
    Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
    Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
  ];
}

let active = null;

canvas.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;

  // Capture keeps events flowing if the stylus leaves the canvas mid-stroke.
  // It is an optimisation, not a requirement — and it throws NotFoundError if
  // the pointer is no longer active by the time we get here. Letting that
  // escape would abort the handler and silently drop the whole stroke, so the
  // analyst would draw and nothing would appear. Never worth failing over.
  try { canvas.setPointerCapture(e.pointerId); } catch { /* draw anyway */ }

  const id = `s${Date.now().toString(36)}${seq++}`;
  const width = e.pressure > 0 && e.pointerType === 'pen'
    ? Math.round(4 + e.pressure * 8)   // stylus pressure -> stroke width
    : 7;

  const init = { k: 'begin', id, tool, ink, width };
  book.begin(init);
  relay(init);

  if (tool === 'tag' && tagTeam) {
    book.meta(id, { team: tagTeam });
    relay({ k: 'meta', id, meta: { team: tagTeam } });
  }

  active = { id };
  pending = { id, pts: [] };
  addPoint(e);
});

function addPoint(e) {
  if (!active) return;
  // coalesced events keep fast strokes smooth without raising message rate
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (events.length ? events : [e])) {
    const p = pointFrom(ev);
    book.append(active.id, [p]);
    pending.pts.push(p);
  }
}

canvas.addEventListener('pointermove', e => { if (active) addPoint(e); });

function finish() {
  if (!active) return;
  flush();
  const stroke = book.end(active.id);
  relay({ k: 'end', id: active.id });

  // The durable record: one event per finished stroke, not one per sample.
  // Enough to reconstruct the annotation for a post-match card or the archive.
  if (stroke) {
    desk.emit({
      type: 'telestrator.stroke',
      payload: {
        id: stroke.id, tool: stroke.tool, ink: stroke.ink,
        width: stroke.width, meta: stroke.meta,
        pts: stroke.pts.map(([x, y]) => [Math.round(x * 1e4) / 1e4, Math.round(y * 1e4) / 1e4]),
      },
    });
  }
  active = null;
  pending = null;
}
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
  canvas.addEventListener(ev, finish);
}

// ---- toolbar --------------------------------------------------------------
/**
 * One place decides what is selected. The tag tool has no toolbar button —
 * it is selected by picking a team, so `tagTeam` is set first and setTool
 * reads it rather than clearing it.
 */
function setTool(t) {
  tool = t;
  if (t !== 'tag') tagTeam = null;
  for (const b of document.querySelectorAll('[data-tool]')) {
    b.setAttribute('aria-pressed', String(b.dataset.tool === t));
  }
  for (const b of document.querySelectorAll('.tag')) {
    b.setAttribute('aria-pressed', String(t === 'tag' && Number(b.dataset.team) === tagTeam));
  }
}
for (const b of document.querySelectorAll('[data-tool]')) {
  b.onclick = () => setTool(b.dataset.tool);
}
for (const b of document.querySelectorAll('[data-ink]')) {
  b.onclick = () => {
    ink = b.dataset.ink;
    for (const o of document.querySelectorAll('[data-ink]')) {
      o.setAttribute('aria-pressed', String(o.dataset.ink === ink));
    }
  };
}

const doUndo = () => { book.undo(); relay({ k: 'undo' }); };
const doClear = () => { book.clear(); relay({ k: 'clear' }); desk.emit({ type: 'telestrator.clear' }); };
$('undo').onclick = doUndo;
$('clear').onclick = doClear;
$('hide').onclick = () => desk.emit({ type: 'telestrator.hide' });

// ---- team tags, built from the loaded match --------------------------------
function buildTags(state) {
  const red = state?.match?.red ?? [];
  const blue = state?.match?.blue ?? [];
  $('tags').innerHTML = [...red.map(t => [t, 'red']), ...blue.map(t => [t, 'blue'])]
    .map(([t, side]) => `<button class="tag" data-alliance="${side}" data-team="${t.number}">${t.number}</button>`)
    .join('');
  for (const b of document.querySelectorAll('.tag')) {
    b.onclick = () => { tagTeam = Number(b.dataset.team); setTool('tag'); };
  }
}

// ---- frozen frame ----------------------------------------------------------
let lastFrame;
desk.on('state', s => {
  const frame = s.telestrator?.frame ?? null;
  if (frame !== lastFrame) {
    lastFrame = frame;
    const img = $('frameImg');
    img.hidden = !frame;
    $('noFrame').hidden = !!frame;
    if (frame) img.src = frame;
  }
  if ((s.match?.id ?? null) !== buildTags.lastMatch) {
    buildTags.lastMatch = s.match?.id ?? null;
    buildTags(s);
  }
});

desk.on('link', up => {
  $('dot').dataset.up = String(up);
  $('statusText').textContent = up ? 'linked' : 'reconnecting…';
});

// ---- render loop -----------------------------------------------------------
const fadeMs = () => parseFloat(getComputedStyle(document.documentElement)
  .getPropertyValue('--ink-fade')) || 6000;

startTicker(() => {
  flush();
  book.prune(fadeMs());
  render(ctx, book, { fadeMs: fadeMs() });
});

// ---- keyboard (for a laptop fallback; the tablet uses the toolbar) ---------
const KEYS = { p: 'pen', a: 'arrow', e: 'ellipse', s: 'spotlight', r: 'path' };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) { setTool(KEYS[k]); return; }
  if (k === 'z') doUndo();
  if (k === 'c') doClear();
  if (k === 'h') desk.emit({ type: 'telestrator.hide' });
});
</script>
</body>
</html>
