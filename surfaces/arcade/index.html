<!doctype html>
<html lang="en" data-key="alpha" data-scale="stream">
<head>
<meta charset="utf-8">
<title>Arcade overlay — CalGames 2026</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/broadcast.css">
<style>
/* Same component vocabulary as the match overlay — panel, chip, numeral block.
   Player sides use purple and green, NOT alliance red/blue: those mean FRC
   alliance on this broadcast and nowhere else, and borrowing them here would
   quietly poison the association we spend all weekend building. */
.ar-card {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: 1fr 300px 1fr;
  background-color: var(--cg-purple-deep);
  background-image: var(--tex-perf), linear-gradient(180deg, var(--cg-purple-lo), var(--cg-purple-deep));
  background-size: var(--tex-perf-size), cover;
  border-top: var(--rule);
  min-height: 148px;
}
:root[data-scale="venue"] .ar-card { min-height: 240px; }

.ar-side { display: flex; align-items: center; gap: var(--gap); padding: 18px 32px; }
.ar-side--p2 { flex-direction: row-reverse; text-align: right; }
.ar-side--p1 { background: var(--cg-purple); border-right: var(--rule); }
.ar-side--p2 { background: var(--cg-green-lo); border-left: var(--rule); }

.ar-name {
  font-family: var(--font-display); font-weight: 800; font-size: var(--t-title);
  font-variation-settings: "wdth" var(--wdth-display); line-height: 1.02;
}
.ar-team {
  font-family: var(--font-cond); font-weight: 600; font-size: var(--t-label);
  letter-spacing: .1em; text-transform: uppercase; color: var(--cg-gold);
}
.ar-score {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: var(--t-hero); line-height: 1;
  color: var(--cg-white); letter-spacing: -.04em; margin-left: auto;
}
.ar-side--p2 .ar-score { margin-left: 0; margin-right: auto; }
/* Unconfirmed scores render outlined, exactly like an estimated match score. */
.ar-score[data-est="true"] { color: transparent; -webkit-text-stroke: 3px var(--cg-white); }

.ar-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
.ar-round {
  font-family: var(--font-cond); font-weight: 700; font-size: var(--t-label);
  letter-spacing: .16em; text-transform: uppercase; color: var(--cg-gold); text-align: center;
}
.ar-game { font-size: calc(var(--t-label) * .8); }

/* ---- Mario Kart standings ---- */
.gp {
  position: absolute; right: var(--safe-x); bottom: 190px; width: 620px;
  background-color: var(--cg-purple);
  background-image: var(--tex-perf); background-size: var(--tex-perf-size);
  clip-path: var(--chamfer);
  box-shadow: inset 0 6px 0 var(--cg-gold);
  padding: 20px 26px;
}
.gp[hidden] { display: none; }
.gp h2 {
  margin: 0 0 12px; font-family: var(--font-cond); font-weight: 700;
  font-size: var(--t-label); letter-spacing: .18em; text-transform: uppercase; color: var(--cg-gold);
}
.gp-row {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: baseline;
  padding: 7px 0; border-bottom: 1px solid var(--cg-purple-hi);
}
.gp-row:last-child { border-bottom: 0; }
.gp-pos { font-family: var(--font-num); font-weight: 900; font-size: var(--t-body); color: var(--cg-gold); }
.gp-name { font-family: var(--font-cond); font-weight: 600; font-size: var(--t-body); text-transform: uppercase; letter-spacing: .04em; }
.gp-pts { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 900; font-size: var(--t-body); }

#upNext {
  position: absolute; left: var(--safe-x); bottom: 190px;
  display: none;
}
#upNext[data-show] { display: inline-flex; }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage">

  <div class="gp" id="gp" hidden>
    <h2 id="gpName">Grand Prix</h2>
    <div id="gpRows"></div>
  </div>

  <span class="chip chip--accent" id="upNext"></span>

  <div class="ar-card" id="card" hidden>
    <div class="ar-side ar-side--p1">
      <div>
        <div class="ar-name" id="p1Name">—</div>
        <div class="ar-team" id="p1Team"></div>
      </div>
      <div class="ar-score num" id="p1Score">0</div>
    </div>
    <div class="ar-mid">
      <div class="ar-round" id="round">&nbsp;</div>
      <div class="chip ar-game" id="game">Smash</div>
    </div>
    <div class="ar-side ar-side--p2">
      <div>
        <div class="ar-name" id="p2Name">—</div>
        <div class="ar-team" id="p2Team"></div>
      </div>
      <div class="ar-score num" id="p2Score">0</div>
    </div>
  </div>

  <div id="sweep"></div>
</div></div>

<script type="module">
import { connect, applyDisplayMode, roll, startTicker } from '/shared/desk-client.js';

applyDisplayMode();
const $ = id => document.getElementById(id);
const desk = connect('arcade');

const stage = $('stage');
const fit = () => {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
};
addEventListener('resize', fit); fit();

const GAME_LABEL = { smash: 'Super Smash Bros.', mariokart: 'Mario Kart', other: 'Arcade' };

let snap = null;
const load = async () => {
  try { paint(await fetch('/api/arcade').then(r => r.json())); } catch { /* transient */ }
};

function paint(s) {
  if (!s) return;
  snap = s;

  // ---- head-to-head set ----
  const set = s.set;
  $('card').hidden = !set;
  if (set) {
    const est = set.scoreConfidence === 'estimated';
    [0, 1].forEach(i => {
      const p = set.players[i];
      $(`p${i + 1}Name`).textContent = p?.name ?? '—';
      // The crossover: entrants registered by FRC team read as the team.
      $(`p${i + 1}Team`).textContent = p?.team
        ? `${p.team}${p.teamName ? ' · ' + p.teamName : ''}`
        : '';
      const el = $(`p${i + 1}Score`);
      el.dataset.est = String(est);
      roll(el, set.scores[i] ?? 0);
    });
    $('round').textContent = set.round ?? '';
    $('game').textContent = GAME_LABEL[set.game] ?? 'Arcade';
  }

  // ---- grand prix standings ----
  const gp = s.gp;
  $('gp').hidden = !gp;
  if (gp) {
    $('gpName').textContent = `${gp.name} · race ${Math.min(gp.races.length + 1, gp.raceCount)} of ${gp.raceCount}`;
    $('gpRows').innerHTML = s.standings.map((row, i) => `
      <div class="gp-row">
        <span class="gp-pos num">${i + 1}</span>
        <span class="gp-name">${escapeHtml(row.player.name)}${
          row.player.team ? ` <span style="color:var(--cg-gold)">${row.player.team}</span>` : ''}</span>
        <span class="gp-pts num">${row.points}</span>
      </div>`).join('');
  }

  $('upNext').toggleAttribute('data-show', !!s.upNext);
  if (s.upNext) $('upNext').textContent = `Up next · ${s.upNext}`;
}

for (const t of ['arcade.set_start', 'arcade.score', 'arcade.set_end', 'arcade.bracket_updated']) {
  desk.on(t, ev => paint(ev.payload));
}
desk.on('link', up => { if (up) load(); });
load();

// Keeps the overlay honest if an event is missed while the source is hidden.
startTicker(() => { if (!snap) return; });

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
</script>
</body>
</html>
