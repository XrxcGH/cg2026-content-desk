<!doctype html>
<html lang="en" data-key="luma" data-scale="venue">
<head>
<meta charset="utf-8">
<title>Side screen — CalGames 2026</title>
<link rel="stylesheet" href="/theme/tokens.css">
<link rel="stylesheet" href="/shared/fonts.css">
<link rel="stylesheet" href="/shared/broadcast.css">
<style>
/* Venue side screens: pit TVs and the queueing area, read from 20-60ft.
   Defaults to data-scale="venue" (72px type floor) because these are the one
   surface that is ONLY ever seen in the room. Rotates between panels on its
   own — nobody is operating a pit TV. */
#stage {
  background-color: var(--cg-purple-void);
  background-image: var(--tex-perf), var(--atmo);
  background-size: var(--tex-perf-size), cover;
}

.panel-screen { position: absolute; inset: 0; display: none; padding: var(--safe-y) var(--safe-x); }
.panel-screen[data-active] { display: flex; flex-direction: column; }

h1 {
  margin: 0 0 8px; font-family: var(--font-cond); font-weight: 700;
  font-size: var(--t-title); letter-spacing: .2em; text-transform: uppercase;
  color: var(--cg-gold);
}
.sub { font-family: var(--font-cond); font-size: var(--t-label); color: var(--cg-white-dim);
  letter-spacing: .1em; text-transform: uppercase; margin-bottom: 22px; }
.tick { height: 6px; background: var(--tick); margin-bottom: 26px; }

/* ---- on deck ---- */
.deck { display: flex; flex-direction: column; gap: var(--gap); flex: 1; }
.deck-row {
  display: grid; grid-template-columns: 260px 1fr 1fr; gap: var(--gap); align-items: center;
  background-color: var(--cg-purple);
  background-image: var(--tex-perf); background-size: var(--tex-perf-size);
  clip-path: var(--chamfer); padding: 18px 26px;
}
.deck-row:first-child { box-shadow: inset 0 8px 0 var(--cg-gold); }
.deck-name {
  font-family: var(--font-num); font-weight: 900; font-size: var(--t-title);
  letter-spacing: -.02em;
}
.deck-teams {
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 700; font-size: var(--t-body); letter-spacing: .04em;
  padding: 10px 18px;
}
.deck-teams--red  { background: var(--alliance-red);  border-left: var(--rule); }
.deck-teams--blue { background: var(--alliance-blue); border-left: var(--rule); }

/* ---- rankings ---- */
.rank-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px var(--gap); align-content: start; }
.rank-row {
  display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; align-items: baseline;
  background: var(--cg-purple); clip-path: var(--chamfer); --ch: 14px;
  padding: 12px 20px;
}
.rank-n { font-family: var(--font-num); font-weight: 900; font-size: var(--t-body); color: var(--cg-gold); }
.rank-team { font-family: var(--font-cond); font-weight: 600; font-size: var(--t-body);
  text-transform: uppercase; letter-spacing: .04em; overflow: hidden; white-space: nowrap; }
.rank-team b { font-family: var(--font-num); font-weight: 900; margin-right: 10px; }
.rank-rp { font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-weight: 900; font-size: var(--t-body); }

.empty { color: var(--cg-white-dim); font-family: var(--font-cond);
  font-size: var(--t-body); letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stageWrap"><div id="stage">

  <section class="panel-screen" id="scr-deck" data-active>
    <h1>On deck</h1>
    <div class="sub" id="deckSub">&nbsp;</div>
    <div class="tick"></div>
    <div class="deck" id="deck"></div>
  </section>

  <section class="panel-screen" id="scr-rank">
    <h1>Rankings</h1>
    <div class="sub" id="rankSub">&nbsp;</div>
    <div class="tick"></div>
    <div class="rank-grid" id="rank"></div>
  </section>

</div></div>

<script type="module">
import { connect, applyDisplayMode, restart } from '/shared/desk-client.js';

applyDisplayMode();
const $ = id => document.getElementById(id);
const desk = connect('side');

const stage = $('stage');
const fit = () => {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
};
addEventListener('resize', fit); fit();

// Rotate on a timer. A pit TV has no operator, and a screen that shows one
// thing forever stops being looked at.
const PANELS = ['deck', 'rank'];
const DWELL_MS = 14_000;
let panel = 0;

function show(i) {
  panel = i % PANELS.length;
  PANELS.forEach((p, n) => $(`scr-${p}`).toggleAttribute('data-active', n === panel));
}
setInterval(() => show(panel + 1), DWELL_MS);

function paint(s) {
  if (!s) return;

  // ---- on deck ----
  const up = s.upcoming ?? [];
  $('deckSub').textContent = s.match?.displayName
    ? `Now playing · ${s.match.displayName}`
    : 'Waiting for the field';
  $('deck').innerHTML = up.length
    ? up.map(m => `
        <div class="deck-row">
          <div class="deck-name num">${escapeHtml(m.shortName || m.name)}</div>
          <div class="deck-teams deck-teams--red">${m.red.join('&nbsp;&nbsp;')}</div>
          <div class="deck-teams deck-teams--blue">${m.blue.join('&nbsp;&nbsp;')}</div>
        </div>`).join('')
    : '<div class="empty">Schedule not published yet</div>';

  // ---- rankings ----
  const rows = (s.rankings ?? []).slice(0, 16);
  $('rankSub').textContent = s.highestPlayedMatch
    ? `Through ${s.highestPlayedMatch}`
    : 'No matches played';
  $('rank').innerHTML = rows.length
    ? rows.map(r => `
        <div class="rank-row">
          <span class="rank-n num">${r.rank}</span>
          <span class="rank-team"><b>${r.team}</b>${escapeHtml(r.name)}</span>
          <span class="rank-rp num">${r.rankingPoints}</span>
        </div>`).join('')
    : '<div class="empty">No rankings yet</div>';
}

desk.on('state', paint);
desk.on('ready', () => paint(desk.state));

// A new match loading is the one thing worth interrupting the rotation for.
desk.on('match.loaded', () => { show(0); restart($('scr-deck'), 'data-active'); });

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
</script>
</body>
</html>
